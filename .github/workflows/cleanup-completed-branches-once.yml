name: One-time branch cleanup (Fallout-1.5-Resurrection-KR)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'munument1/Fallout-1.5-Resurrection-KR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"agent/korean-gdi-font","sha":"6a593a2cae32bd63b8724de1cf32460a20b6c400","pr":1},{"name":"codex/native-korean-engine-20261017","sha":"ed3bf56a41e62e4b314e7d908e6b66bd44878a4a","pr":3},{"name":"codex/resurrection-native-beta2","sha":"fa61f23a3181c57353843ad1072f7a5c3a528ebf","pr":4},{"name":"codex/shared-korean-engine","sha":"63e6bd1b4790044b29bc6e4bfa9428807c542fe7","pr":2},{"name":"docs/restore-kr11-recommended","sha":"3b5e6c6ee94470d9e3f6c1b747c0d827b383b843","pr":5}];
            if(context.repo.owner!=='munument1'||context.repo.repo!=="Fallout-1.5-Resurrection-KR"||context.ref!=='refs/heads/main')throw Error('Wrong repository/ref');
            const owner=context.repo.owner,repo=context.repo.repo;
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(prs.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(blocked.has(c.name)||c.name==='main'||c.name==='gh-pages'){skipped.push(c.name+': protected');continue;}
             const b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data;
             const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
             if(b.protected||b.commit.sha!==c.sha||!p.merged_at||p.base.ref!=='main'||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': changed');continue;}
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});deleted++;core.info('DELETED '+c.name);
            }
            for(const x of skipped)core.warning('SKIPPED '+x);
            core.info('Finished cleanup: '+deleted+' deleted of '+targets.length+' planned');
